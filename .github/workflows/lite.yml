name: Build data-lite.json

on:
  push:
    branches: [main]
    paths: ['data.json', 'tools/build_lite.py']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build
        run: python tools/build_lite.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data-lite.json
          git diff --cached --quiet || (git commit -m "עדכון אוטומטי של data-lite.json" && git push)
