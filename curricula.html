*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:"IBM Plex Sans Hebrew","Arial Hebrew",Arial,sans-serif;font-size:17px;line-height:1.6}
a{color:var(--pine)}
:focus-visible{outline:3px solid var(--pine);outline-offset:2px;border-radius:6px}
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--paper) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}

.brand{font-family:"Suez One",serif;font-size:1.35rem;color:var(--pine);text-decoration:none}
.top nav a{color:var(--muted);text-decoration:none;font-size:.95rem;padding:6px 10px;border-radius:999px}

.wrap{max-width:1080px;margin:0 auto;padding:0 16px 60px}
h1{font-family:"Suez One",serif;font-weight:400;font-size:clamp(2rem,5vw,3rem);line-height:1.1;margin:32px 0 6px;color:var(--pine)}

.chip[aria-pressed="true"]{background:var(--pine);border-color:var(--pine);color:var(--on-pine)}

.inst{color:var(--muted);margin-top:4px}
.btn{display:inline-flex;align-items:center;gap:8px;background:var(--pine);color:var(--on-pine);text-decoration:none;border-radius:999px;padding:10px 18px;font-weight:600;font-size:.95rem;white-space:nowrap}
.btn.line{background:transparent;color:var(--pine);border:1.5px solid var(--pine)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin:18px 0 8px}
.stat{background:var(--paper);border-radius:14px;padding:12px 14px}
.stat b{display:block;font-size:1.6rem;line-height:1.1;font-variant-numeric:tabular-nums}
.stat span{font-size:.85rem;color:var(--muted)}
.bar{display:flex;height:14px;border-radius:999px;overflow:hidden;margin:14px 0 8px;background:var(--line)}

<script>
const DATA=JSON.parse(document.getElementById('curdata').textContent);
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const YN=['א׳','ב׳','ג׳','ד׳','ה׳','ו׳','ז׳'];

function initInst(){const s=$('inst');s.innerHTML=Object.entries(DATA.institutions).map(([k,v])=>`<option value="${k}">${esc(v.name)}</option>`).join('');}
function chips(){const I=DATA.institutions[cur.inst];const q=$('q').value.trim();const names=I.degs.filter(n=>!q||n.includes(q)).sort((a,b)=>a.localeCompare(b,'he'));$('chips').innerHTML=names.map(n=>`<button class="chip" aria-pressed="${n===cur.deg}" data-d="${esc(n)}">${esc(n)}</button>`).join('')||'<span class="inst">לא נמצא תואר בשם הזה</span>';}
function cr(v){return typeof v==='string'?v.replace('/', '–'):(+v).toFixed(1).replace(/\.0$/,'.0')}

 if(cats.length){h+=`<div class="bar" role="img" aria-label="חלוקת הנקודות">${cats.map((c,i)=>`<i style="width:${parseFloat(c[1])/tot*100}%;background:${colors[i%5]}"></i>`).join('')}</div><div class="legend">${cats.map((c,i)=>`<span style="--k:${colors[i%5]}">${esc(c[0])}: <b>${esc(c[1])}</b> ${U}</span>`).join('')}</div>`}
 if(p.pdfv){const ng=p.years.reduce((a,y)=>a+y.groups.length,0),nk=p.years.reduce((a,y)=>a+y.groups.filter(g=>g.ok).length,0);h+=`<div class="verify${nk===ng?'':' warn'}">${nk===ng?'✓':'⚠'} <span>התוכנית חולצה מקובץ השנתון הרשמי (PDF) של ${esc(I.short||I.name)}. ב-${nk} מתוך ${ng} הסמסטרים סכום הנקודות של הקורסים תואם לסיכום שמופיע בשנתון.${p.auto?' החילוץ אוטומטי מטבלאות הקובץ, ולכן ייתכנו שיבושים בשמות קורסים או בשיוך שלהם – חשוב לבדוק בשנתון לפני תכנון.':''}</span></div>`}else if(p.auto)h+=`<div class="verify warn">⚠ <span>התוכנית חולצה אוטומטית מ${p.pdf?'קובץ השנתון (PDF)':'טקסט השנתון הדיגיטלי'} של ${esc(I.short||I.name)}. הטקסט שם כתוב באופן שונה בכל חוג, ולכן ייתכנו קורסים חסרים, קבוצות שלא שויכו נכון או ערבוב בין מסלולים – חשוב לבדוק בשנתון לפני תכנון.</span></div>`;else h+=`<div class="verify">✓ <span>הנתונים נשלפו ישירות ממאגר ${I.unit?'הידיעון':'השנתון'} הרשמי של ${esc(I.short||I.name)}: הקורסים, ${p.unit?'השעות':'נקודות הזכות'} והדרישות בכל קבוצה כפי שהם מופיעים שם.${p.unit?' ב-ת״א מודדים בש״ס – שעות סמסטריאליות (שעה שבועית לאורך סמסטר).':''}</span></div>`;

 let h=`<article class="card"><div class="head"><div><h2>${esc(cur.deg)}</h2><div class="inst">${esc(I.name)}${p.code?` · קוד מסלול ${esc(p.code)}`:''} · קטלוג ${esc(I.year)}</div></div><div style="display:flex;gap:8px;flex-wrap:wrap">${cmpBtn()}<a class="btn" href="${url}" target="_blank" rel="noopener">לתוכנית בקטלוג הרשמי ↗</a></div></div>`;

function loadInst(k){const I=DATA.institutions[k];if(I.programs)return Promise.resolve(I);return fetch(I.src).then(r=>r.json()).then(j=>{I.programs=j;return I})}
function toggleCmp(){const i=CMP.findIndex(x=>x.inst===cur.inst&&x.deg===cur.deg);if(i>=0)CMP.splice(i,1);else{if(CMP.length>=3){alertBar('אפשר להשוות עד 3 תוכניות. הסירו אחת כדי להוסיף.');return}CMP.push({inst:cur.inst,deg:cur.deg})}const b=$('addcmp');if(b)b.outerHTML=cmpBtn();bindAdd();drawBar();setUrl()}

 const d=$('docmp');if(d)d.onclick=showCompare}
const SYN=[[/חדו\s?א|חשבון דיפרנציאלי ואינטגרלי/g,'חשבון אינפיניטסימלי'],[/^אלגברה( א| 1)?$/,'אלגברה לינארית'],[/ (למדמ ח|למדעי המחשב|להנדסה|למדעים|לתלמידי [^ ]+)$/,''],[/^מבוא לתכנות( בשפת [^ ]+)?$/,'מבוא למדעי המחשב'],[/מבני נתונים ואלגוריתמים/,'מבני נתונים']];
const norm=t=>{let x=String(t||'').replace(/["״׳'()\-–,.:]/g,' ').replace(/\s+/g,' ').trim();for(let i=0;i<2;i++){x=x.replace(/ (א|ב|ג|1|2|3|I|II|מ|ח)$/,'').trim();SYN.forEach(([r,v])=>{x=x.replace(r,v).trim()})}return x};
function summarize(I,p){const S={url:p.url,unit:'נק״ז',years:[],cats:[]};
 if(p.mode==='years'){S.unit=p.unit?p.unit.replace('"','״'):'נ״ז';S.total=p.total||'';S.yn=p.years_n||p.years.length;
  S.mand=p.years.reduce((a,y)=>a+y.groups.filter(g=>g.m).reduce((b,g)=>b+g.c.length,0),0);S.el=p.years.reduce((a,y)=>a+y.groups.filter(g=>!g.m).reduce((b,g)=>b+(g.n||g.c.length),0),0);
  S.cats=(p.cats||[]).filter(c=>/^\d+(\.\d+)?$/.test(String(c[1]).trim())&&parseFloat(c[1])>0);S.auto=!!p.auto;S.src=(I.unit?'ידיעון ':'שנתון ')+(p.year||I.year);
  S.nomark=!S.mand;p.years.forEach(y=>S.years.push({label:y.label||('שנה '+(YN[y.y-1]||y.y)),tot:y.tot||'',c:y.groups.filter(g=>g.m||S.nomark).flatMap(g=>g.c.map(c=>c[1]))}))}
 else{S.url=I.catalogBase+encodeURIComponent(p.file)+I.catalogSuffix+(p.page?'#page='+p.page:'');S.total=p.total||'';const last=Math.max(...p.sems.map(s=>s.n));S.yn=Math.max(1,Math.ceil(last/2),Math.round((parseFloat(p.total)||0)/39));
  S.mand=p.sems.reduce((a,s)=>a+s.c.filter(c=>c[0]).length,0);S.el=p.elect.length;S.cats=(p.cats||[]).filter(c=>/[א-ת]/.test(c[0])&&/^\d+(\.\d+)?$/.test(String(c[1]).trim()));S.src='קטלוג '+I.year;
  for(let y=1;y<=S.yn;y++){const ss=p.sems.filter(s=>Math.ceil(s.n/2)===y);if(!ss.length)continue;S.years.push({label:'שנה '+(YN[y-1]||y),tot:ss.reduce((a,s)=>a+(parseFloat(s.tot)||s.sum||0),0).toFixed(1),c:ss.flatMap(s=>s.c.filter(c=>c[0]).map(c=>c[1]))})}}

  h+=row('קורסים לבחירה',it=>it.S.el?esc(it.S.el)+' <small class="inst">ברשימה</small>':'<span class="inst">לא מפורט ברשימה – ראו בשנתון</span>');
  h+=row('חלוקת הנקודות',it=>it.S.cats.length?it.S.cats.map(c=>`${esc(c[0])}: <b>${esc(c[1])}</b>`).join('<br>'):'<span class="inst">לא מפורטת במקור</span>');
  h+=row('קורסים משותפים',(it)=>{if(it.S.nomark)return '<span class="inst">—</span>';const k=[...new Set(it.S.years.flatMap(y=>y.c.map(norm)))].filter(n=>shared.has(n)).length;return k?`${k} קורסי חובה שמופיעים גם בתוכנית אחרת`:'אין קורס חובה בשם זהה בתוכניות האחרות'});
  for(let y=0;y<maxY;y++)h+=row((items.find(it=>it.S.years[y])||{S:{years:[{label:'שנה '+(y+1)}]}}).S.years[y].label.replace(/^שנה/,'חובה – שנה'),it=>{const Y=it.S.years[y];return Y?`${Y.tot&&+Y.tot?`<div class="inst" style="font-size:.82rem">${esc(Y.tot)} ${esc(it.S.unit)}</div>`:''}${list(Y.c)}`:'—'});
  h+=row('מקור',it=>`${esc(it.S.src)}${it.S.auto?' <span class="tag chk">חולץ אוטומטית – לבדוק</span>':''}<br><a href="${it.S.url}" target="_blank" rel="noopener">לתוכנית הרשמית ↗</a><br><a href="?inst=${encodeURIComponent(it.x.inst)}&deg=${encodeURIComponent(it.x.deg)}">לתוכנית המלאה כאן</a>`);
  h+=`</tbody></table></div><p class="inst" style="font-size:.85rem;margin-top:10px">שימו לב: מוסדות סופרים יחידות שונות (נקודות זכות, ש״ס בתל אביב), ולכן ההיקף לא תמיד בר-השוואה ישיר. ההתאמה בין קורסים נעשית לפי השם בלבד. הנתונים להכוונה – יש לוודא בשנתון.</p></article>`;
  $('out').innerHTML=h;$('backone').onclick=()=>render();$('out').scrollIntoView({behavior:'smooth',block:'start'});setUrl();
 }).catch(()=>{$('out').innerHTML='<div class="card empty">לא ניתן היה לטעון את התוכניות להשוואה. נסו לרענן את העמוד.</div>'})}

$('chips').onclick=e=>{const b=e.target.closest('.chip');if(!b)return;cur.deg=b.dataset.d;render();$('out').scrollIntoView({behavior:'smooth',block:'start'})};
$('q').oninput=chips;
$('inst').onchange=()=>{cur.inst=$('inst').value;cur.deg=null;render()};
const _render=render;render=function(){_render();bindAdd();drawBar()};
initInst();const sp=new URLSearchParams(location.search);(sp.get('cmp')||'').split('|').forEach(t=>{const [i,d]=t.split('::');if(i&&d&&DATA.institutions[i]&&DATA.institutions[i].degs.includes(d)&&CMP.length<3)CMP.push({inst:i,deg:d})});cur.inst=DATA.institutions[sp.get('inst')]?sp.get('inst'):Object.keys(DATA.institutions)[0];$('inst').value=cur.inst;cur.deg=DATA.institutions[cur.inst].degs.includes(sp.get('deg'))?sp.get('deg'):null;render();if(CMP.length>=2&&sp.get('view')!=='one')showCompare();
$('foot').textContent='מקור: '+Object.values(DATA.institutions).map(i=>i.name+' – '+i.sourceNote).join(' · ')+'. האימות האוטומטי בודק שסכום נקודות הקורסים בכל סמסטר תואם לסיכום שבקטלוג.';
</script>
