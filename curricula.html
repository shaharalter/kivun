מש פתרון מעשי של בעיה הנדסית תוך שימוש במיומנויות שנרכשו במהלך הלימודים. הפרויקט יתבצע בהדרכת מורי האוניברסיטה, בשילוב עם מומחים מתעשיות ההיי-טק. הפרויקט מתבסס על עבודת צוות בזוגות, תוך תכנון ומימוש פרויקטים הנדסיים המשלבים ידע מתחומי התמחות שונים.\n\nאבני פינה- יש לבחור קורסים אלו החל משנה ג'.\n\nתלמידי המסלול מחויבים ללמוד 8 נ\"ז מתוכנית אבני פינה בשנים ג' וד'- 4 נ\"ז מתחום חברה ו-4 נ\"ז מתחום רוח.\n\nלרשימת הקורסים ולמידע נוסף על תוכנית אבני פינה: http://science.huji.ac.il/he/cornerstones","years":[{"y":1,"groups":[{"t":"חובה","m":true,"min":51,"note":". חובה ללמוד את הקורס 80187 בסמ' א', ואת קורס 67101 בסמ' ב'. יש ללמוד את הקורס 67100 במקביל לקורס 67101.","span":null,"n":11,"ok":true,"c":[["80153","אלגברה ליניארית לתלמידי הנדסה ומדעים 1",4,"סמ׳ א"],["83312","מכניקה ויחסות פרטית לתלמידי הנדסה",7,"סמ׳ א"],["80114","מתמטיקה שימושית (1)",6,"סמ׳ א"],["67010","נושאים בהנדסת חשמל ומדעי המחשב",1,"סמ׳ א"],["67100","הכרת המערכת",0,"סמ׳ א או ב"],["67101","מבוא למדעי המחשב",7,"סמ׳ א או ב"],["80187","מתמטיקה דיסקרטית לתלמידי הנדסה ומדעים",5,"סמ׳ א או ב"],["80154","אלגברה ליניארית לתלמידי הנדסה ומדעים 2",3,"סמ׳ ב"],["80177","חשבון אינפיניטסימלי לתלמידי הנדסה ומדעים",6,"סמ׳ ב"],["83313","חשמל ומגנטיות לתלמידי הנדסה",6,"סמ׳ ב"],["80157","מתמטיקה שימושית (2)",6,"סמ׳ ב"]]},{"t":"בחירה","m":false,"min":0,"note":". יתקיימו סדנאות למידה פעילה לקורסי מתמטיקה 80153, 80177. הסדנאות אינן חובה. יינתנו נקודות מגן בקורס בתמורה להשתתפות פעילה בסדנה.","span":null,"n":4,"ok":null,"c":[["80053","סדנת למידה פעילה נלווית לקורס אלגברה ליניארית לתלמידי הנדסה ומדעים 1",0,"סמ׳ א"],["83002","סדנת למידה פעילה נלווית לקורס מכניקה ויחסות פרטית לתלמידי הנדסה",0,"סמ׳ א"],["67099","צעדים ראשונים בתכנות",0,"סמ׳ א או ב"],["80077","סדנת למידה פעילה נלווית לקורס חשבון אינפיניטסימלי לתלמידי הנדסה ומדעים",0,"סמ׳ ב"]]}]},{"y":2,"groups":[{"t":"חובה","m":true,"min":51,"note":". יש ללמוד את הקורסים 67109,80430, 67315 בסמסטר א ואת 67504 בסמ' ב'. את קורס 83328 יש לקחת בשנה ב' או בשנה ג'. תלמידים שהתחילו את לימודיהם ל ם באמצעות לימודים עיוניים ומעבדות, ובתחום המעניין אותם באופן אישי על בסיס הידע שצברו במהלך שנות התואר. הם יוכלו לבחור מתוך מגוון של קורסי בחירה הניתנים על ידי חוקרי המכון.\n\nבוגרי החוג יכולים להמשיך לימודיהם במחקר לתואר שני באוניברסיטה עברית או בכל מוסד אחר בארץ או בחו\"ל, או למצוא תעסוקה בשוק החופשי שכולל תעשיות כימיות מסורתיות או עתירות ידע, מעבדות מחקר ממשלתיות או פרטיות, מוסדות חינוך או בריאות.\n\nתנאי לזכאות לתואר בוגר הוא סיום בהצלחה של 2 קורסי בחירה שנלמדים באוניברסיטה בשפה האנגלית. תנאי זה רלוונטי לכל תלמיד בוגר שהתחיל את לימודיו החל משנת הלימודים תשפ\"ב.","years":[{"y":1,"groups":[{"t":"בחירה","m":false,"min":0,"note":". סדנת למידה נלוות לקורס חובה 69904. ההשתתפות בסדנא הינה רשות אך מומלצת להצלחה בקורס.","span":null,"n":1,"ok":null,"c":[["69003","סדנה פעילה בהסתברות וסטטיסטיקה לכימאים",0,"סמ׳ א"]]},{"t":"בחירה","m":false,"min":0,"note":"סדנת למידה נלוות לקורס חובה 69107. ההשתתפות בסדנא הינה רשות אך מומלצת להצלחה בקורס.","span":null,"n":1,"ok":null,"c":[["69917","סדנה פעילה במבוא לכימיה",0,"סמ׳ א"]]},{"t":"חובה קורסי יסוד","m":false,"min":52,"note":". לתשומת ליבכם: קורס ממוחשב בבטיחות (76222) מהווה דרישת קדם לקורסי מעבדה. שימו לב: על מנת שנוכל להערך למעבדות בהתאם לכמות המשתתפים בהן מבעוד מועד אנו מבקשים להרשם אליהן עם פתיחת מערכת הרישום בראשית השנה בכפוף לדרישות הקדם המופיעים כהערה בתחתית המידע אודות קורסי המעבדה.","span":null,"n":12,"ok":null,"c":[["69904","מבוא להסתברות וסטטיסטיקה לתלמידי כימיה",3,"סמ׳ א"],["69107","מבוא לכימיה",7,"סמ׳ א"],["80109","מתמטיקה לתלמידי כימיה וכדה\"א (1)",6,"סמ׳ א"],["77130","פיסיקה כללית - מכניקה לתלמידי כימיה וכדה\"א",6,"סמ׳ א"],["76408","הכרת משאבי הספרייה לתלמידי מדעי הטבע- קורס מתוקשב",0,"סמ׳ א או ב"],["76222","קורס ממוחשב בבטיחות - שנה א'",0,"סמ׳ א או ב"],["69128","כימיה אורגנית א'",5,"סמ׳ ב"],["69106","כימיה אנליטית א'",4,"סמ׳ ב"],["69163","כימיה פיסיקלית א'",5,"סמ׳ ב"],["80112","מבוא מתמטי לתלמידי כימיה וכדה\"א (2)",6,"סמ׳ ב"],["69115","מעבדה - מבוא לכימיה",3,"סמ׳ ב"],["77131","פיסיקה כללית - גלים וחשמל לתלמידי כימיה ו גל החיים\" (65647) והקורס \"אופקים חדשניים במחקר מזון ותזונה\" (71479) ילמדו בשפה האנגלית.\n\n \n\nלקבלת תואר בוגר יש לסיים את הקורסים \"ביוכימיה\" (71080)  ו\"תזונת האדם\" (65214)  בציון 70 לפחות, אך ציון 60 לפחות בקורסים הנ\"ל מספיק כדרישה מוקדמת לקורסי המשך.\n\n \n\nציון 65  בקורסים 71066+71067  או 71090 יהווה דרישה מקדימה לקורס 71080  וקורס 65214.\n\n \n\nציון 75 ומעלה בקורסים \"דיאטיקה א' (65320), דיאטטיקה ב' (65322) יהווה דרישה מקדימה להכשרה בבתי החולים בשנה ד'.\n\n \n\nנוסף על כך, יש לעבור את ההכשרה הקלינית ולסיים את הקורסים המלווים את ההכשרה בציון 70 לפחות.\n\n \n\nהיציאה להכשרה הקלינית בשנה ג' מותנית בהשלמת כל חובות הלימודים עד סוף שנה ב' + חובות קורסים שמהווים תנאי להכשרה.\n\nהיציאה להכשרה הקלינית בשנה ד' מותנית בהשלמת כל חובות הלימודים עד סוף שנה ג' + חובות קורסים שמהווים תנאי להכשרה בשנה ד'.\n\n \n\nמשרד הבריאות מחייב שכל סטודנט יעמוד בדרישות חיסונים כתנאי להשתתפות בלימודים הקליניים.\n\nעל פי ההנחיות העדכניות של משרד הבריאות כל תלמיד במקצועות הבריאות חייב לעמוד בכל דרישות החיסונים ובכל תוספת חיסונים המופיעה ברשימת הדרישות של משרד הבריאות.\n\nתלמיד חדש במקצועות הבריאות ","years":[{"y":1,"groups":[{"t":"חובה","m":true,"min":48.5,"note":". להלן טבלת קורסי חובה המדגימה מהלך אופטימאלי של לימודים בחוג. חריגה מרצף לימודים מומלץ המתפרס על פני שמונה סמסטרים, עלולה לשבש את מהלך הלימודים הסדיר ואף להיות כרוכה בהוצאות נוספות. קורסי אבני פינה - יש להשלים קורס אחד מתחום הרוח עד סוף התואר.","span":null,"n":19,"ok":true,"c":[["71050","בטיחות",0,"סמ׳ א"],["71078","ביולוגיה של התא",3.5,"סמ׳ א"],["65101","הכרות עם עבודת התזונאי/דיאטן",1,"סמ׳ א"],["65028","השלמה באלגברה ובטריגונומטריה",0,"סמ׳ א"],["71054","חשבון דיפרנציאלי ואינטגרלי א'",3,"סמ׳ א"],["65217","מבוא לפסיכולוגיה",3,"סמ׳ א"],["71073","מעבדה בעקרונות הכימיה",2,"סמ׳ א"],["71074","עקרונות הכימיה",7,"סמ׳ א"],["71061","פיזיקה למדעי החקלאות א'",3,"סמ׳ א"],["65225","תצפיות בטיפול תזונתי",0,"סמ׳ א"],["71066","עקרונות בכימיה אורגנית א",2,"שנתי"],["65130","אנטומיה ופיזיולוגיה של האדם- חלק א'",3,"סמ׳ ב"],["71044","ביולוגיה <script>
const DATA=JSON.parse(document.getElementById('curdata').textContent);
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const YN=['א׳','ב׳','ג׳','ד׳','ה׳','ו׳','ז׳'];
let cur={inst:null,deg:null};
function initInst(){const s=$('inst');s.innerHTML=Object.entries(DATA.institutions).map(([k,v])=>`<option value="${k}">${esc(v.name)}</option>`).join('');}
function chips(){const I=DATA.institutions[cur.inst];const q=$('q').value.trim();const names=Object.keys(I.programs).filter(n=>!q||n.includes(q)).sort((a,b)=>a.localeCompare(b,'he'));$('chips').innerHTML=names.map(n=>`<button class="chip" aria-pressed="${n===cur.deg}" data-d="${esc(n)}">${esc(n)}</button>`).join('')||'<span class="inst">לא נמצא תואר בשם הזה</span>';}
function cr(v){return typeof v==='string'?v.replace('/', '–'):(+v).toFixed(1).replace(/\.0$/,'.0')}

function renderYears(I,p){const semN={'א':'סמ׳ א','ב':'סמ׳ ב','ש':'שנתי','ק':'קיץ'};
 const mandN=p.years.reduce((a,y)=>a+y.groups.filter(g=>g.m).reduce((b,g)=>b+g.c.length,0),0);const elN=p.years.reduce((a,y)=>a+y.groups.filter(g=>!g.m).reduce((b,g)=>b+g.n,0),0);
 const cats=(p.cats||[]).filter(c=>parseFloat(c[1])>0);const colors=['var(--c1)','var(--c2)','var(--c3)','var(--c4)','var(--c5)'];const tot=cats.reduce((a,c)=>a+parseFloat(c[1]),0);
 let h=`<article class="card"><div class="head"><div><h2>${esc(cur.deg)}</h2><div class="inst">${esc(I.name)} · ${esc(p.title)}${p.deg?' · '+esc(p.deg):''} · שנתון ${esc(I.year)}</div></div><a class="btn" href="${p.url}" target="_blank" rel="noopener">לתוכנית בשנתון הרשמי ↗</a></div>`;
 h+=`<div class="stats"><div class="stat"><b>${esc(p.total||'—')}</b><span>נקודות זכות לתואר</span></div><div class="stat"><b>${p.years_n}</b><span>שנות לימוד</span></div><div class="stat"><b>${mandN}</b><span>קורסי חובה</span></div><div class="stat"><b>${elN}</b><span>קורסים לבחירה</span></div></div>`;
 if(cats.length){h+=`<div class="bar" role="img" aria-label="חלוקת הנקודות">${cats.map((c,i)=>`<i style="width:${parseFloat(c[1])/tot*100}%;background:${colors[i%5]}"></i>`).join('')}</div><div class="legend">${cats.map((c,i)=>`<span style="--k:${colors[i%5]}">${esc(c[0])}: <b>${esc(c[1])}</b> נ״ז</span>`).join('')}</div>`}
 h+=`<div class="verify">✓ <span>הנתונים נשלפו ישירות ממאגר השנתון הרשמי של ${esc(I.short||I.name)}: הקורסים, נקודות הזכות והדרישות בכל קבוצה כפי שהם מופיעים שם.</span></div>`;
 if(p.info)h+=`<details class="el" style="margin-top:14px"><summary>מידע כללי על התוכנית</summary><div class="elin" style="white-space:pre-line;font-size:.92rem">${esc(p.info)}</div></details>`;
 h+='<div class="years">';
 for(const y of p.years){h+=`<section class="year"><h3>שנה ${YN[y.y-1]||y.y}</h3>`;
  for(const g of y.groups){const many=!g.m&&g.c.length>8;const span=g.span?` <span class="sm2">· שנים ${g.span.map(x=>YN[x-1]).join('–')}</span>`:'';const req=g.min?(g.m?`${g.min} נ״ז`:`לפחות ${g.min} נ״ז`):(g.m?'':'רשות');
   const head=`<span><span class="gt ${g.m?'m':'e'}">${esc(g.t||'')}</span>${span}</span><span class="sm2">${req}${g.n?` · ${g.n} קורסים`:''}${g.ok?' · <span class="tag ok">סכום תואם</span>':''}</span>`;
   const body=`${g.note?`<div class="gnote">${esc(g.note)}</div>`:''}<table><tbody>${g.c.map(c=>`<tr><td>${esc(c[1])}${c[3]?`<span class="semt">${esc(semN[c[3]]||c[3])}</span>`:''}<span class="num">${esc(c[0])}</span></td><td class="cr">${esc(c[2]!=null?(+c[2]).toFixed(1):'')}</td></tr>`).join('')}</tbody></table>${g.n>g.c.length?`<div class="semsum"><span>מוצגים ${g.c.length} מתוך ${g.n} קורסים – הרשימה המלאה בשנתון</span></div>`:''}`;
   h+=many?`<details class="grpc"><summary>${head}</summary>${body}</details>`:`<div class="grpc"><header>${head}</header>${body}</div>`}
  h+='</section>'}
 h+='</div></article>';return h}
function render(){const I=DATA.institutions[cur.inst];const p=I.programs[cur.deg];chips();

 if(p.mode==='years'){$('out').innerHTML=renderYears(I,p);const u=new URL(location);u.searchParams.set('inst',cur.inst);u.searchParams.set('deg',cur.deg);history.replaceState(null,'',u);return}

 const sems=p.sems;const okN=sems.filter(s=>s.ok).length;const lastSem=Math.max(...sems.map(s=>s.n));const years=Math.max(1,Math.ceil(lastSem/2),Math.round((parseFloat(p.total)||0)/39));

 h+=`<div class="stats"><div class="stat"><b>${esc(p.total||'—')}</b><span>נקודות זכות לתואר</span></div><div class="stat"><b>${years}</b><span>שנות לימוד בתוכנית</span></div><div class="stat"><b>${sems.reduce((a,s)=>a+s.c.filter(c=>c[0]).length,0)}</b><span>קורסי חובה בשיבוץ</span></div><div class="stat"><b>${p.elect.length}</b><span>קורסי בחירה ברשימה</span></div></div>`;
 if(cats.length){h+=`<div class="bar" role="img" aria-label="חלוקת הנקודות">${cats.map((c,i)=>`<i style="width:${Math.max(2,parseFloat(c[1])/tot*100)}%;background:${colors[i%5]}"></i>`).join('')}</div><div class="legend">${cats.map((c,i)=>`<span style="--k:${colors[i%5]}">${esc(catNice(c[0]))}: <b>${esc(c[1])}</b> נק׳</span>`).join('')}</div>`}
 h+= okN===sems.length?`<div class="verify">✓ <span>כל ${sems.length} הסמסטרים אומתו: סכום הנקודות של הקורסים בכל סמסטר תואם לסיכום שמופיע בקטלוג.</span></div>`:`<div class="verify warn">⚠ <span>${okN} מתוך ${sems.length} סמסטרים אומתו מול הסיכום שבקטלוג. סמסטרים המסומנים ״לבדיקה״ כוללים בעיקר אפשרויות בחירה – כדאי לבדוק אותם בקטלוג המקורי.</span></div>`;
 h+='<div class="years">';
 for(let y=1;y<=years;y++){const ss=sems.filter(s=>Math.ceil(s.n/2)===y);if(!ss.length)continue;const ysum=ss.reduce((a,s)=>a+(parseFloat(s.tot)||s.sum||0),0);

   for(const c of s.c){const el=!c[0];h+=`<tr class="${el?'el':''}"><td>${esc(c[1])}${c[0]?`<span class="num">${esc(c[0])}</span>`:''}${c[3]&&Array.isArray(c[3])?`<span class="alt">או: ${esc(c[3][1])} (${esc(c[3][0])})</span>`:''}</td><td class="cr">${esc(cr(c[2]))}</td></tr>`}
   h+=`</tbody></table><div class="semsum"><span>סה״כ בסמסטר</span><b>${esc(s.tot||s.sum)} נק׳</b></div></div>`}
  h+='</div></section>'}
 if(lastSem<years*2)h+=`<p class="inst" style="margin:0">בסמסטרים ${lastSem+1}–${years*2} אין קורסי חובה בשיבוץ המומלץ: משלימים בהם קורסי בחירה ופרויקטים לפי כללי התוכנית.</p>`;
 h+='</div>';
 if(p.elect.length){const g={};p.elect.forEach(e=>{const k=(e[3]||'קורסי בחירה').replace(/\s+/g,' ').trim().slice(0,70);(g[k]=g[k]||[]).push(e)});
  h+=`<details class="el"><summary>קורסי בחירה (${p.elect.length})</summary><div class="elin"><input type="search" id="eq" placeholder="סינון קורסי בחירה"><div id="egr">`;
  for(const [k,arr] of Object.entries(g)){h+=`<div class="grp"><h4>${esc(k)}</h4><div class="grid">${arr.map(e=>`<div class="ec" data-n="${esc(e[1])}"><span>${esc(e[1])}<br><span class="num">${esc(e[0])}</span></span><b>${esc(cr(e[2]))}</b></div>`).join('')}</div></div>`}
  h+=`</div><p class="inst" style="font-size:.85rem;margin-top:10px">מוצגת רשימה חלקית. הרשימה המלאה והכללים לבחירה (כמה נקודות מכל קבוצה) מופיעים בקטלוג.</p></div></details>`}
 h+='</article>';$('out').innerHTML=h;
 const eq=$('eq');if(eq)eq.oninput=()=>{const v=eq.value.trim();document.querySelectorAll('.ec').forEach(x=>x.style.display=!v||x.dataset.n.includes(v)?'':'none')};
 const u=new URL(location);u.searchParams.set('inst',cur.inst);u.searchParams.set('deg',cur.deg);history.replaceState(null,'',u);
}
$('chips').onclick=e=>{const b=e.target.closest('.chip');if(!b)return;cur.deg=b.dataset.d;render();$('out').scrollIntoView({behavior:'smooth',block:'start'})};
$('q').oninput=chips;
$('inst').onchange=()=>{cur.inst=$('inst').value;cur.deg=null;render()};
initInst();const sp=new URLSearchParams(location.search);cur.inst=DATA.institutions[sp.get('inst')]?sp.get('inst'):Object.keys(DATA.institutions)[0];$('inst').value=cur.inst;cur.deg=DATA.institutions[cur.inst].programs[sp.get('deg')]?sp.get('deg'):null;render();
$('foot').textContent='מקור: '+Object.values(DATA.institutions).map(i=>i.name+' – '+i.sourceNote).join(' · ')+'. האימות האוטומטי בודק שסכום נקודות הקורסים בכל סמסטר תואם לסיכום שבקטלוג.';
</script>
