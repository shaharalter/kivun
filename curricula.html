<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>תוכניות לימודים – כיוון</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Suez+One&family=IBM+Plex+Sans+Hebrew:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--paper:#F3F6F1;--surface:#FFFFFF;--ink:#1E2B25;--muted:#5C6B63;--pine:#1F4D3F;--pine-soft:#DCE8E1;--sun:#F0B429;--sun-soft:#FCEFC7;--line:#D3DCD5;--good:#2E7D4F;--mid:#8A5600;--hard:#B3412F;--on-pine:#F3F6F1;--c1:#1F4D3F;--c2:#F0B429;--c3:#6F9C86;--c4:#B9CFC2;--c5:#8A5600}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#121A16;--surface:#1A241F;--ink:#E7EEE9;--muted:#A3B2AA;--pine:#8FC7AE;--pine-soft:#22352C;--sun:#F0B429;--sun-soft:#3A3115;--line:#2E3D35;--good:#7FCB9C;--mid:#E5B45C;--hard:#F08A78;--on-pine:#10241C;--c1:#8FC7AE;--c2:#F0B429;--c3:#5E8F78;--c4:#3E5A4C;--c5:#E5B45C}}
:root[data-theme="dark"]{--paper:#121A16;--surface:#1A241F;--ink:#E7EEE9;--muted:#A3B2AA;--pine:#8FC7AE;--pine-soft:#22352C;--sun:#F0B429;--sun-soft:#3A3115;--line:#2E3D35;--good:#7FCB9C;--mid:#E5B45C;--hard:#F08A78;--on-pine:#10241C;--c1:#8FC7AE;--c2:#F0B429;--c3:#5E8F78;--c4:#3E5A4C;--c5:#E5B45C}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:"IBM Plex Sans Hebrew","Arial Hebrew",Arial,sans-serif;font-size:17px;line-height:1.6}
a{color:var(--pine)}
:focus-visible{outline:3px solid var(--pine);outline-offset:2px;border-radius:6px}
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--paper) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top .in{max-width:1080px;margin:0 auto;padding:0 16px;height:56px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{font-family:"Suez One",serif;font-size:1.35rem;color:var(--pine);text-decoration:none}
.top nav a{color:var(--muted);text-decoration:none;font-size:.95rem;padding:6px 10px;border-radius:999px}
.top nav a:hover{background:var(--pine-soft);color:var(--pine)}
.wrap{max-width:1080px;margin:0 auto;padding:0 16px 60px}
h1{font-family:"Suez One",serif;font-weight:400;font-size:clamp(2rem,5vw,3rem);line-height:1.1;margin:32px 0 6px;color:var(--pine)}
.lead{color:var(--muted);margin:0 0 22px;max-width:62ch}
.picker{display:grid;grid-template-columns:220px 1fr;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px}
@media (max-width:700px){.picker{grid-template-columns:1fr}}
label.sm{display:block;font-size:.85rem;font-weight:600;color:var(--muted);margin-bottom:4px}
select,input[type=search]{width:100%;font:inherit;font-size:1rem;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--paper);color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;max-height:150px;overflow:auto}
.chip{border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:999px;padding:5px 12px;font:inherit;font-size:.9rem;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--pine);border-color:var(--pine);color:var(--on-pine)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:22px;margin-top:18px}
.head{display:flex;flex-wrap:wrap;justify-content:space-between;gap:16px;align-items:flex-start}
.head h2{font-family:"Suez One",serif;font-weight:400;font-size:clamp(1.6rem,4vw,2.2rem);margin:0;color:var(--ink);line-height:1.15}
.inst{color:var(--muted);margin-top:4px}
.btn{display:inline-flex;align-items:center;gap:8px;background:var(--pine);color:var(--on-pine);text-decoration:none;border-radius:999px;padding:10px 18px;font-weight:600;font-size:.95rem;white-space:nowrap}
.btn.line{background:transparent;color:var(--pine);border:1.5px solid var(--pine)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin:18px 0 8px}
.stat{background:var(--paper);border-radius:14px;padding:12px 14px}
.stat b{display:block;font-size:1.6rem;line-height:1.1;font-variant-numeric:tabular-nums}
.stat span{font-size:.85rem;color:var(--muted)}
.bar{display:flex;height:14px;border-radius:999px;overflow:hidden;margin:14px 0 8px;background:var(--line)}
.bar i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:.88rem;color:var(--muted)}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;background:var(--k);margin-inline-end:6px;vertical-align:-1px}
.verify{display:flex;gap:10px;align-items:flex-start;background:var(--pine-soft);border-radius:14px;padding:10px 14px;font-size:.9rem;margin-top:14px}
.verify.warn{background:var(--sun-soft)}
.years{margin-top:22px;display:grid;gap:16px}
.year h3{font-size:1.15rem;margin:0 0 10px;display:flex;align-items:center;gap:10px}
.year h3 small{font-weight:400;color:var(--muted);font-size:.9rem}
.sems{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:780px){.sems{grid-template-columns:1fr}}
.sem{border:1px solid var(--line);border-radius:16px;overflow:hidden;background:var(--surface)}
.sem header{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 14px;background:var(--paper);border-bottom:1px solid var(--line)}
.sem header b{font-size:1rem}
.tag{font-size:.75rem;font-weight:600;border-radius:999px;padding:2px 9px;white-space:nowrap}
.tag.ok{background:var(--pine-soft);color:var(--good)}
.tag.chk{background:var(--sun-soft);color:var(--mid)}
table{width:100%;border-collapse:collapse}
td{padding:8px 14px;border-bottom:1px solid var(--line);vertical-align:top;font-size:.95rem}
tr:last-child td{border-bottom:0}
td.cr{text-align:left;font-variant-numeric:tabular-nums;font-weight:600;width:60px;white-space:nowrap}
td .num{display:block;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.75rem;color:var(--muted);direction:ltr;text-align:right}
tr.el td{color:var(--muted)}
tr.el td:first-child::before{content:"בחירה · ";color:var(--mid);font-weight:600;font-size:.8rem}
.alt{display:block;font-size:.85rem;color:var(--muted)}
.semsum{display:flex;justify-content:space-between;padding:8px 14px;background:var(--paper);font-size:.88rem;color:var(--muted);border-top:1px solid var(--line)}
details.el{margin-top:22px;border:1px solid var(--line);border-radius:16px;background:var(--surface)}
details.el>summary{cursor:pointer;padding:14px 16px;font-weight:700;list-style:none;display:flex;justify-content:space-between;gap:10px}
details.el>summary::-webkit-details-marker{display:none}
details.el>summary::after{content:"+";font-size:1.3rem;color:var(--pine);line-height:1}
details.el[open]>summary::after{content:"–"}
.elin{padding:0 16px 16px}
.grp{margin-top:14px}
.grp h4{margin:0 0 6px;font-size:.95rem;color:var(--pine)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:6px}
.ec{border:1px solid var(--line);border-radius:10px;padding:7px 10px;font-size:.9rem;display:flex;justify-content:space-between;gap:8px}
.ec .num{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.72rem;color:var(--muted);direction:ltr}
.empty{color:var(--muted);text-align:center;padding:40px 10px}
.foot{color:var(--muted);font-size:.85rem;margin-top:26px;border-top:1px solid var(--line);padding-top:14px}
.grpc{border:1px solid var(--line);border-radius:16px;overflow:hidden;margin-bottom:12px;background:var(--surface)}
.grpc>header,.grpc>summary{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;padding:10px 14px;background:var(--paper);border-bottom:1px solid var(--line);cursor:default;list-style:none}
.grpc>summary{cursor:pointer}.grpc>summary::-webkit-details-marker{display:none}
.grpc .gt{font-weight:700}.grpc .gt.m{color:var(--pine)}.grpc .gt.e{color:var(--mid)}
.grpc .gnote{padding:8px 14px;font-size:.88rem;color:var(--muted);border-bottom:1px solid var(--line)}
.sm2{font-size:.8rem;color:var(--muted);font-weight:400}
.semt{display:inline-block;font-size:.72rem;border:1px solid var(--line);border-radius:6px;padding:0 5px;margin-inline-start:6px;color:var(--muted)}
@media print{.top,.picker,.btn{display:none}.card{border:0}}
</style>
</head>

<p class="lead">איך נראה התואר בפועל: אילו קורסים לומדים בכל שנה ובכל סמסטר, כמה נקודות זכות, ומה החובה ומה הבחירה. הנתונים נלקחו מקטלוג הלימודים הרשמי של המוסד לשנת תשפ״ז, עם קישור למקור.</p>

ה","פיזיקה","פילוסופיה","פסיכולוגיה","קולנוע וטלוויזיה","ריפוי בעיסוק","רפואה","רפואת שיניים","שפה וספרות ערבית"],"src":"curricula/data/tau.json"},"bgu":{"unit":false,"name":"אוניברסיטת בן-גוריון בנגב","short":"בן-גוריון","year":"תשפ״ז 2026/27","sourceNote":"שנתוני הפקולטות של אוניברסיטת בן-גוריון תשפ״ז (bgu.ac.il)","degs":["ביוטכנולוגיה","ביולוגיה","גאוגרפיה","היסטוריה","הנדסה אזרחית","הנדסה ביו-רפואית","הנדסה כימית","הנדסת חומרים","הנדסת חשמל ואלקטרוניקה","הנדסת מכונות","הנדסת תוכנה","הנדסת תעשייה וניהול","כימיה","כלכלה","מדע המדינה ויחסים בינלאומיים","מדעי ההתנהגות","מדעי המחשב","מדעי הנתונים","מדעי הסביבה וכדור הארץ","מזרח תיכון ואסלאם","מערכות מידע","מתמטיקה","סוציולוגיה ואנתרופולוגיה","ספרות","ספרות ושפה אנגלית","עבודה סוציאלית","פיזיותרפיה","פיזיקה","פילוסופיה","פסיכולוגיה","רפואת חירום (פרמדיק)","תקשורת"],"src":"curricula/data/bgu.json"},"haifa":{"unit":false,"name":"אוניברסיטת חיפה","short":"אוניברסיטת חיפה","year":"תשפ״ז 2026/27","sourceNote":"השנתון הדיגיטלי של אוניברסיטת חיפה תשפ״ז (shnaton2027.haifa.ac.il)","degs":["ביולוגיה","גאוגרפיה","חינוך ולמידה","כלכלה","מדעי הנתונים","מערכות מידע","מתמטיקה","סוציולוגיה ואנתרופולוגיה","פיזיותרפיה","פסיכולוגיה","תקשורת"],"src":"curricula/data/haifa.json"}}}</script>
<script>
const DATA=JSON.parse(document.getElementById('curdata').textContent);
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const YN=['א׳','ב׳','ג׳','ד׳','ה׳','ו׳','ז׳'];
let cur={inst:null,deg:null};
function initInst(){const s=$('inst');s.innerHTML=Object.entries(DATA.institutions).map(([k,v])=>`<option value="${k}">${esc(v.name)}</option>`).join('');}
function chips(){const I=DATA.institutions[cur.inst];const q=$('q').value.trim();const names=I.degs.filter(n=>!q||n.includes(q)).sort((a,b)=>a.localeCompare(b,'he'));$('chips').innerHTML=names.map(n=>`<button class="chip" aria-pressed="${n===cur.deg}" data-d="${esc(n)}">${esc(n)}</button>`).join('')||'<span class="inst">לא נמצא תואר בשם הזה</span>';}
function cr(v){return typeof v==='string'?v.replace('/', '–'):(+v).toFixed(1).replace(/\.0$/,'.0')}

function renderYears(I,p){const U=p.unit?p.unit.replace('"','״'):'נ״ז';const semN={'א':'סמ׳ א','ב':'סמ׳ ב','ש':'שנתי','ק':'קיץ'};
 const mandN=p.years.reduce((a,y)=>a+y.groups.filter(g=>g.m).reduce((b,g)=>b+g.c.length,0),0);const elN=p.years.reduce((a,y)=>a+y.groups.filter(g=>!g.m).reduce((b,g)=>b+g.n,0),0);
 const cats=(p.cats||[]).filter(c=>parseFloat(c[1])>0);const colors=['var(--c1)','var(--c2)','var(--c3)','var(--c4)','var(--c5)'];const tot=cats.reduce((a,c)=>a+parseFloat(c[1]),0);
 let h=`<article class="card"><div class="head"><div><h2>${esc(cur.deg)}</h2><div class="inst">${esc(I.name)} · ${esc(p.title)}${p.deg?' · '+esc(p.deg):''} · ${I.unit?'ידיעון':'שנתון'} ${esc(I.year)}</div></div><a class="btn" href="${p.url}" target="_blank" rel="noopener">${I.unit?'לתוכנית בידיעון הרשמי':'לתוכנית בשנתון הרשמי'} ↗</a></div>`;
 h+=`<div class="stats"><div class="stat"><b>${esc(p.total||'—')}</b><span>${p.unit?'ש״ס (שעות סמסטריאליות) בתוכנית':'נקודות זכות לתואר'}</span></div><div class="stat"><b>${p.years_n}</b><span>שנות לימוד</span></div><div class="stat"><b>${mandN}</b><span>קורסי חובה</span></div><div class="stat"><b>${elN}</b><span>קורסים לבחירה</span></div></div>`;
 if(cats.length){h+=`<div class="bar" role="img" aria-label="חלוקת הנקודות">${cats.map((c,i)=>`<i style="width:${parseFloat(c[1])/tot*100}%;background:${colors[i%5]}"></i>`).join('')}</div><div class="legend">${cats.map((c,i)=>`<span style="--k:${colors[i%5]}">${esc(c[0])}: <b>${esc(c[1])}</b> ${U}</span>`).join('')}</div>`}
 if(p.pdfv){const ng=p.years.reduce((a,y)=>a+y.groups.length,0),nk=p.years.reduce((a,y)=>a+y.groups.filter(g=>g.ok).length,0);h+=`<div class="verify${nk===ng?'':' warn'}">${nk===ng?'✓':'⚠'} <span>התוכנית חולצה מקובץ השנתון הרשמי (PDF) של ${esc(I.short||I.name)}. ב-${nk} מתוך ${ng} הסמסטרים סכום הנקודות של הקורסים תואם לסיכום שמופיע בשנתון.${p.auto?' החילוץ אוטומטי מטבלאות הקובץ, ולכן ייתכנו שיבושים בשמות קורסים או בשיוך שלהם – חשוב לבדוק בשנתון לפני תכנון.':''}</span></div>`}else if(p.auto)h+=`<div class="verify warn">⚠ <span>התוכנית חולצה אוטומטית מ${p.pdf?'קובץ השנתון (PDF)':'טקסט השנתון הדיגיטלי'} של ${esc(I.short||I.name)}. הטקסט שם כתוב באופן שונה בכל חוג, ולכן ייתכנו קורסים חסרים, קבוצות שלא שויכו נכון או ערבוב בין מסלולים – חשוב לבדוק בשנתון לפני תכנון.</span></div>`;else h+=`<div class="verify">✓ <span>הנתונים נשלפו ישירות ממאגר ${I.unit?'הידיעון':'השנתון'} הרשמי של ${esc(I.short||I.name)}: הקורסים, ${p.unit?'השעות':'נקודות הזכות'} והדרישות בכל קבוצה כפי שהם מופיעים שם.${p.unit?' ב-ת״א מודדים בש״ס – שעות סמסטריאליות (שעה שבועית לאורך סמסטר).':''}</span></div>`;
 if(p.info)h+=`<details class="el" style="margin-top:14px"><summary>מידע כללי על התוכנית</summary><div class="elin" style="white-space:pre-line;font-size:.92rem">${esc(p.info)}</div></details>`;
 h+='<div class="years">';
 for(const y of p.years){h+=`<section class="year"><h3>${y.label?esc(y.label):'שנה '+(YN[y.y-1]||y.y)}${y.tot?` <small>${y.tot} ${U}</small>`:''}</h3>`;
  for(const g of y.groups){const many=!g.m&&g.c.length>8;const span=g.span?` <span class="sm2">· שנים ${g.span.map(x=>YN[x-1]).join('–')}</span>`:'';const req=g.min?(g.m?`${g.min} ${U}`:`לפחות ${g.min} ${U}`):(g.m?'':'רשות');
   const head=`<span><span class="gt ${g.m?'m':'e'}">${esc(g.t||'')}</span>${span}</span><span class="sm2">${req}${g.n?` · ${g.n} קורסים`:''}${g.ok?' · <span class="tag ok">סכום תואם</span>':''}</span>`;
   const body=`${g.note?`<div class="gnote">${esc(g.note)}</div>`:''}<table><tbody>${g.c.map(c=>`<tr><td>${esc(c[1])}${c[3]?`<span class="semt">${esc(semN[c[3]]||c[3])}</span>`:''}<span class="num">${esc(c[0])}</span></td><td class="cr">${esc(c[2]!=null?(+c[2]).toFixed(1):'')}</td></tr>`).join('')}</tbody></table>${g.n>g.c.length?`<div class="semsum"><span>מוצגים ${g.c.length} מתוך ${g.n} קורסים – הרשימה המלאה במקור</span></div>`:''}`;
   h+=many?`<details class="grpc"><summary>${head}</summary>${body}</details>`:`<div class="grpc"><header>${head}</header>${body}</div>`}
  h+='</section>'}
 h+='</div></article>';return h}
function render(){const I=DATA.institutions[cur.inst];chips();if(cur.deg&&!I.programs){$('out').innerHTML='<div class="card empty">טוען את תוכנית הלימודים…</div>';fetch(I.src).then(r=>r.json()).then(j=>{I.programs=j;render()}).catch(()=>{$('out').innerHTML='<div class="card empty">לא ניתן היה לטעון את הנתונים כרגע. נסו לרענן את העמוד.</div>'});return}const p=cur.deg?I.programs[cur.deg]:null;
 if(!p){$('out').innerHTML='<div class="card empty">בחרו תואר כדי לראות את תוכנית הלימודים</div>';return}
 if(p.mode==='years'){$('out').innerHTML=renderYears(I,p);const u=new URL(location);u.searchParams.set('inst',cur.inst);u.searchParams.set('deg',cur.deg);history.replaceState(null,'',u);return}
 const url=I.catalogBase+encodeURIComponent(p.file)+I.catalogSuffix+(p.page?'#page='+p.page:'');
 const sems=p.sems;const okN=sems.filter(s=>s.ok).length;const lastSem=Math.max(...sems.map(s=>s.n));const years=Math.max(1,Math.ceil(lastSem/2),Math.round((parseFloat(p.total)||0)/39));
 const cats=(p.cats||[]).filter(c=>/[א-ת]/.test(c[0])&&/\d/.test(c[1]));
 const colors=['var(--c1)','var(--c2)','var(--c3)','var(--c4)','var(--c5)'];
 const tot=parseFloat(p.total)||cats.reduce((a,c)=>a+parseFloat(c[1]),0);
 const catNice=t=>t.replace(/פקולטית מקצועות בחירה|מקצועות בחירה פקולטית/,'בחירה פקולטית').replace(/טכניונית - (כלל )?מקצועות בחירה( כלל)?|טכניונית - כלל מקצועות בחירה/,'בחירה כלל-טכניונית').replace(/^ה? ?מקצועות חוב.?$/,'מקצועות חובה').replace(/ליבה מקצועות/,'מקצועות ליבה').trim();
 let h=`<article class="card"><div class="head"><div><h2>${esc(cur.deg)}</h2><div class="inst">${esc(I.name)}${p.code?` · קוד מסלול ${esc(p.code)}`:''} · קטלוג ${esc(I.year)}</div></div><a class="btn" href="${url}" target="_blank" rel="noopener">לתוכנית בקטלוג הרשמי ↗</a></div>`;
 h+=`<div class="stats"><div class="stat"><b>${esc(p.total||'—')}</b><span>נקודות זכות לתואר</span></div><div class="stat"><b>${years}</b><span>שנות לימוד בתוכנית</span></div><div class="stat"><b>${sems.reduce((a,s)=>a+s.c.filter(c=>c[0]).length,0)}</b><span>קורסי חובה בשיבוץ</span></div><div class="stat"><b>${p.elect.length}</b><span>קורסי בחירה ברשימה</span></div></div>`;
 if(cats.length){h+=`<div class="bar" role="img" aria-label="חלוקת הנקודות">${cats.map((c,i)=>`<i style="width:${Math.max(2,parseFloat(c[1])/tot*100)}%;background:${colors[i%5]}"></i>`).join('')}</div><div class="legend">${cats.map((c,i)=>`<span style="--k:${colors[i%5]}">${esc(catNice(c[0]))}: <b>${esc(c[1])}</b> נק׳</span>`).join('')}</div>`}
 h+= okN===sems.length?`<div class="verify">✓ <span>כל ${sems.length} הסמסטרים אומתו: סכום הנקודות של הקורסים בכל סמסטר תואם לסיכום שמופיע בקטלוג.</span></div>`:`<div class="verify warn">⚠ <span>${okN} מתוך ${sems.length} סמסטרים אומתו מול הסיכום שבקטלוג. סמסטרים המסומנים ״לבדיקה״ כוללים בעיקר אפשרויות בחירה – כדאי לבדוק אותם בקטלוג המקורי.</span></div>`;
 h+='<div class="years">';
 for(let y=1;y<=years;y++){const ss=sems.filter(s=>Math.ceil(s.n/2)===y);if(!ss.length)continue;const ysum=ss.reduce((a,s)=>a+(parseFloat(s.tot)||s.sum||0),0);
  h+=`<section class="year"><h3>שנה ${YN[y-1]||y} <small>${ysum?ysum.toFixed(1)+' נק׳':''}</small></h3><div class="sems">`;
  for(const s of ss){h+=`<div class="sem"><header><b>סמסטר ${s.n} <small style="font-weight:400;color:var(--muted)">(${s.n%2?'חורף':'אביב'})</small></b>${s.ok?'<span class="tag ok" title="סכום הנקודות תואם לקטלוג">אומת</span>':'<span class="tag chk" title="לא ניתן היה לאמת אוטומטית">לבדיקה</span>'}</header><table><tbody>`;
   for(const c of s.c){const el=!c[0];h+=`<tr class="${el?'el':''}"><td>${esc(c[1])}${c[0]?`<span class="num">${esc(c[0])}</span>`:''}${c[3]&&Array.isArray(c[3])?`<span class="alt">או: ${esc(c[3][1])} (${esc(c[3][0])})</span>`:''}</td><td class="cr">${esc(cr(c[2]))}</td></tr>`}
   h+=`</tbody></table><div class="semsum"><span>סה״כ בסמסטר</span><b>${esc(s.tot||s.sum)} נק׳</b></div></div>`}
  h+='</div></section>'}
 if(lastSem<years*2)h+=`<p class="inst" style="margin:0">בסמסטרים ${lastSem+1}–${years*2} אין קורסי חובה בשיבוץ המומלץ: משלימים בהם קורסי בחירה ופרויקטים לפי כללי התוכנית.</p>`;
 h+='</div>';
 if(p.elect.length){const g={};p.elect.forEach(e=>{const k=(e[3]||'קורסי בחירה').replace(/\s+/g,' ').trim().slice(0,70);(g[k]=g[k]||[]).push(e)});
  h+=`<details class="el"><summary>קורסי בחירה (${p.elect.length})</summary><div class="elin"><input type="search" id="eq" placeholder="סינון קורסי בחירה"><div id="egr">`;
  for(const [k,arr] of Object.entries(g)){h+=`<div class="grp"><h4>${esc(k)}</h4><div class="grid">${arr.map(e=>`<div class="ec" data-n="${esc(e[1])}"><span>${esc(e[1])}<br><span class="num">${esc(e[0])}</span></span><b>${esc(cr(e[2]))}</b></div>`).join('')}</div></div>`}
  h+=`</div><p class="inst" style="font-size:.85rem;margin-top:10px">מוצגת רשימה חלקית. הרשימה המלאה והכללים לבחירה (כמה נקודות מכל קבוצה) מופיעים בקטלוג.</p></div></details>`}
 h+='</article>';$('out').innerHTML=h;
 const eq=$('eq');if(eq)eq.oninput=()=>{const v=eq.value.trim();document.querySelectorAll('.ec').forEach(x=>x.style.display=!v||x.dataset.n.includes(v)?'':'none')};
 const u=new URL(location);u.searchParams.set('inst',cur.inst);u.searchParams.set('deg',cur.deg);history.replaceState(null,'',u);
}
$('chips').onclick=e=>{const b=e.target.closest('.chip');if(!b)return;cur.deg=b.dataset.d;render();$('out').scrollIntoView({behavior:'smooth',block:'start'})};
$('q').oninput=chips;
$('inst').onchange=()=>{cur.inst=$('inst').value;cur.deg=null;render()};
initInst();const sp=new URLSearchParams(location.search);cur.inst=DATA.institutions[sp.get('inst')]?sp.get('inst'):Object.keys(DATA.institutions)[0];$('inst').value=cur.inst;cur.deg=DATA.institutions[cur.inst].degs.includes(sp.get('deg'))?sp.get('deg'):null;render();
$('foot').textContent='מקור: '+Object.values(DATA.institutions).map(i=>i.name+' – '+i.sourceNote).join(' · ')+'. האימות האוטומטי בודק שסכום נקודות הקורסים בכל סמסטר תואם לסיכום שבקטלוג.';
</script>
