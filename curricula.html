<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>מאגר תוכניות לימודים אקדמיות בישראל</title>
    <style>
        body { font-family: system-ui, -apple-system, sans-serif; background-color: #f4f6f9; color: #333; margin: 0; padding: 20px; direction: rtl; }
        .container { max-width: 900px; margin: 0 auto; background: #fff; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        h1 { color: #1a365d; text-align: center; margin-bottom: 25px; }
        .select-group { margin-bottom: 25px; display: flex; flex-direction: column; gap: 8px; }
        label { font-weight: bold; color: #2d3748; }
        select { padding: 12px; font-size: 16px; border: 1px solid #cbd5e0; border-radius: 8px; background-color: #fff; }
        .program-card { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 8px; padding: 20px; margin-bottom: 20px; }
        .program-card h3 { margin-top: 0; color: #2b6cb0; }
        table { width: 100%; border-collapse: collapse; margin-top: 12px; background: #fff; }
        th, td { border: 1px solid #e2e8f0; padding: 10px; text-align: right; font-size: 14px; }
        th { background-color: #edf2f7; color: #2d3748; }
        .loading { text-align: center; font-size: 18px; color: #718096; padding: 40px; }
        .source-link { font-size: 13px; color: #4a5568; text-decoration: none; display: inline-block; margin-bottom: 10px; }
        .source-link:hover { text-decoration: underline; color: #3182ce; }
    </style>
</head>
<body>

<div class="container">
    <h1>מאגר תוכניות לימודים אקדמיות בישראל</h1>
    
    <div class="select-group">
        <label for="institutionSelect">בחר מוסד אקדמי:</label>
        <select id="institutionSelect" onchange="loadInstitutionData()">
            <option value="">-- טוען רשימת מוסדות מ-GitHub --</option>
        </select>
    </div>

    <div id="contentArea">
        <div class="loading">בחר מוסד אקדמי כדי לצפות בתוכניות הלימודים ובקורסים</div>
    </div>
</div>

<script>
    async function loadInstitutionsList() {
        const select = document.getElementById("institutionSelect");
        try {
            let response = await fetch('https://api.github.com/repos/shaharalter/kivun/contents/curricula/json');
            let files = await response.json();
            
            select.innerHTML = '<option value="">-- בחר מוסד מהרשימה --</option>';
            
            files.filter(f => f.name.endsWith('.json')).forEach(file => {
                let fileName = file.name.replace('.json', '');
                let opt = document.createElement("option");
                // שמירת כתובת ה-Raw המלאה של הקובץ
                opt.value = `https://raw.githubusercontent.com/shaharalter/kivun/main/curricula/json/${file.name}`;
                opt.textContent = fileName.replace(/_/g, " ");
                select.appendChild(opt);
            });
        } catch (e) {
            select.innerHTML = '<option value="">שגיאה בטעינת הרשימה</option>';
        }
    }

    window.onload = loadInstitutionsList;

    async function loadInstitutionData() {
        const fileUrl = document.getElementById("institutionSelect").value;
        const selectElement = document.getElementById("institutionSelect");
        const institutionName = selectElement.options[selectElement.selectedIndex].text;
        const area = document.getElementById("contentArea");
        
        if (!fileUrl) {
            area.innerHTML = '<div class="loading">בחר מוסד אקדמי כדי לצפות בתוכניות הלימודים ובקורסים</div>';
            return;
        }

        area.innerHTML = '<div class="loading">טוען נתונים...</div>';

        try {
            let response = await fetch(fileUrl);
            if (!response.ok) throw new Error("קובץ לא נמצא");
            
            let data = await response.json();
            let html = `<h2>${data.institution || institutionName}</h2>`;
            
            if (!data.programs || data.programs.length === 0) {
                area.innerHTML = html + '<p style="text-align:center; color:#e53e3e;">לא נמצאו תוכניות לימודים זמינות בקובץ זה.</p>';
                return;
            }

            data.programs.forEach(prog => {
                html += `<div class="program-card">
                    <h3>${prog.degree_title}</h3>
                    <a href="${prog.source_url}" target="_blank" class="source-link">🔗 קישור לעמוד המקורי באתר המוסד</a>`;
                
                if (prog.curriculum_sections && prog.curriculum_sections.length > 0) {
                    prog.curriculum_sections.forEach(sec => {
                        html += `<h4>${sec.section}</h4>`;
                        if (sec.courses && sec.courses.length > 0) {
                            html += `<table><thead><tr>`;
                            let keys = Object.keys(sec.courses[0]);
                            keys.forEach(k => html += `<th>${k}</th>`);
                            html += `</tr></thead><tbody>`;
                            
                            sec.courses.forEach(row => {
                                html += `<tr>`;
                                keys.forEach(k => html += `<td>${row[k] !== undefined ? row[k] : ''}</td>`);
                                html += `</tr>`;
                            });
                            html += `</tbody></table>`;
                        } else {
                            html += `<pre style="white-space: pre-wrap; font-family:inherit;">${sec.markdown || ''}</pre>`;
                        }
                    });
                }
                html += `</div>`;
            });

            area.innerHTML = html;
        } catch (error) {
            area.innerHTML = `<p style="text-align:center; color:#e53e3e;">שגיאה בטעינת הקובץ.</p>`;
        }
    }
</script>

</body>
</html>
